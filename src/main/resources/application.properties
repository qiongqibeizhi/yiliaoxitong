spring.application.name=yiliaoxitong

# ---------------- 数据源（MySQL 8） ----------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/yiliaoxitong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}

# 本机开发口令放在 application-local.properties（该文件不入库），启动时自动加载
spring.config.import=optional:classpath:application-local.properties

# ---------------- MyBatis-Plus ----------------
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false

# ---------------- 服务器 ----------------
server.port=8080

# 强制响应使用 UTF-8，避免浏览器（中文环境默认 GBK）把 JSON 中的中文解码成乱码
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
